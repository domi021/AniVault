appId: com.anivault.desktop
productName: AniVault
directories:
  buildResources: build
  output: release
extraMetadata:
  main: electron/main.js
files:
  - 'dist/**'
  - 'electron/**'
  - 'package.json'
  - '!**/node_modules/**'
asar: true
compression: normal
win:
  target: portable
  artifactName: AniVault-${version}-win-${arch}.${ext}
linux:
  target: deb
  executableName: anivault
  artifactName: AniVault-${version}-linux-${arch}.${ext}
  category: AudioVideo
  maintainer: AniVault <anivault@users.noreply.github.com>
publish:
  provider: github
  owner: domi021
  repo: AniVault
